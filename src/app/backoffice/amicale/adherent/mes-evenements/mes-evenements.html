<div class="page">

  <h2>Mes Événements</h2>

  <!-- LOADING -->
  <div *ngIf="loading" class="loading">
    Chargement...
  </div>

  <!-- LIST -->
  <div *ngIf="!loading && inscriptions.length > 0" class="cards">

    <div class="card" *ngFor="let ins of inscriptions">

      <!-- IMAGE -->
      <img 
        [src]="'http://localhost:8080/api/evenements/photo/' + ins.evenement.id"
        class="img"
      >

      <!-- INFOS -->
      <h3>{{ ins.evenement.titre }}</h3>

      <p>📍 {{ ins.evenement.lieu }}</p>

      <p>📅 {{ ins.evenement.dateDebut || '-' }}</p>

      <!-- STATUT INSCRIPTION -->
      <p>
        Statut :
        <span [ngClass]="getStatutClass(ins.statut)">
          {{ ins.statut }}
        </span>
      </p>

      <!-- STATUT PAIEMENT -->
      <p>
        Paiement :
        <span [ngClass]="getPaiementClass(ins.statutPaiement)">
          {{ ins.statutPaiement }}
        </span>
      </p>

    </div>

  </div>

  <!-- EMPTY -->
  <div *ngIf="!loading && inscriptions.length === 0" class="empty">
    Aucun événement inscrit
  </div>

</div>
