<h2>Liste des utilisateurs</h2>
<table>
    <tr>
        <th>Matricule</th>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Email</th>
        <th>Département</th>
        <th>Type Adhérent</th>
        <th>Actions</th>
    </tr>

    <tr *ngFor="let user of users">
        <td>{{ user.matricule }}</td>
        <td>{{ user.nom }}</td>
        <td>{{ user.prenom }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.departement }}</td>
        <td>{{ user.typeAdherent }}</td>
        <td>
            <button class="edit" [routerLink]="['/admin-edit-user', user.matricule]">Modifier</button>
            <button class="delete" (click)="deleteUser(user.matricule)">Supprimer</button>
        </td>
    </tr>
</table>
