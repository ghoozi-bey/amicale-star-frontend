<div class="card">

  <h3>Créer un utilisateur</h3>

  <div class="form">

    <div class="form-group">
      <label>Matricule</label>
      <input [(ngModel)]="newUser.matricule" placeholder="Ex: STAR123456">
    </div>

    <div class="form-group">
      <label>Nom</label>
      <input [(ngModel)]="newUser.nom">
    </div>

    <div class="form-group">
      <label>Prénom</label>
      <input [(ngModel)]="newUser.prenom">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input [(ngModel)]="newUser.email">
    </div>

    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" [(ngModel)]="newUser.password">
    </div>

    <div class="form-group">
      <label>CIN</label>
      <input [(ngModel)]="newUser.cin">
    </div>

    <div class="form-group">
      <label>Téléphone</label>
      <input [(ngModel)]="newUser.telephone">
    </div>

    <div class="form-group">
      <label>Date de naissance</label>
      <input type="date" [(ngModel)]="newUser.dateNaissance">
    </div>

    <div class="form-group">
      <label>Département</label>
      <select [(ngModel)]="newUser.departement">
        <option value="">Choisir département</option>
        <option value="IT">IT</option>
        <option value="RH">RH</option>
        <option value="FINANCE">FINANCE</option>
      </select>
    </div>

    <div class="form-group">
      <label>Rôle</label>
      <select [(ngModel)]="newUser.typeAdherent" (change)="onRoleChange()">
        <option value="ADHERENT">Adhérent</option>
        <option value="MEMBRE_AMICALE">Membre Amicale</option>
        <option value="ADMIN">Admin</option>
      </select>
    </div>

  </div>

  <button class="btn" (click)="createUser()">Créer utilisateur</button>

</div>
