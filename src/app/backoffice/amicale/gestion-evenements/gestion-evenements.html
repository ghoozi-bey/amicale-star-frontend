<div class="form-container">

  <!-- ================= VOYAGE ================= -->
  <div *ngIf="typeEvenementId === 2">

    <h1 class="page-title">Créer un événement VOYAGE </h1>

    <div class="form-group">
      <label>Titre</label>
      <input type="text" [(ngModel)]="event.titre">
    </div>

    <div class="form-group">
      <label>Lieu</label>
      <input type="text" [(ngModel)]="event.lieu">
    </div>

    <div class="form-group">
      <label>Destination</label>
      <input type="text" [(ngModel)]="event.destination">
    </div>

    <div class="form-group">
      <label>Date début</label>
      <input type="date" [(ngModel)]="event.dateDebut">
    </div>

    <div class="form-group">
      <label>Date fin</label>
      <input type="date" [(ngModel)]="event.dateFin">
    </div>

    <div class="form-group">
      <label>Nombre de places</label>
      <input type="number" [(ngModel)]="event.nbPlaces">
    </div>

    <div class="form-group">
      <label>Prix</label>
      <input type="number" [(ngModel)]="event.prix">
    </div>

  </div>

  <!-- ================= OMRA & HAJ ================= -->
  <div *ngIf="typeEvenementId === 1">

    <h1 class="page-title">OMRA & HAJ</h1>

    <div class="form-group">
      <label>Titre</label>
      <input type="text" [(ngModel)]="event.titre">
    </div>

    <div class="form-group">
      <label>Lieu</label>
      <input type="text" [(ngModel)]="event.lieu">
    </div>

    <div class="form-group">
      <label>Agence</label>
      <input type="text" [(ngModel)]="event.agence">
    </div>

    <div class="form-group">
      <label>Date début</label>
      <input type="date" [(ngModel)]="event.dateDebut">
    </div>

    <div class="form-group">
      <label>Date fin</label>
      <input type="date" [(ngModel)]="event.dateFin">
    </div>

    <div class="form-group">
      <label>Nombre de places</label>
      <input type="number" [(ngModel)]="event.nbPlaces">
    </div>

    <div class="form-group">
      <label>Prix</label>
      <input type="number" [(ngModel)]="event.prix">
    </div>

  </div>

  <!-- ================= CONVENTION ================= -->
  <div *ngIf="typeEvenementId === 3">

    <h1 class="page-title">Créer une CONVENTION </h1>

    <div class="form-group">
      <label>Titre</label>
      <input type="text" [(ngModel)]="event.titre">
    </div>

    <div class="form-group">
      <label>Lieu</label>
      <input type="text" [(ngModel)]="event.lieu">
    </div>

    <div class="form-group">
      <label>Société</label>
      <input type="text" [(ngModel)]="event.societe">
    </div>

  </div>

  <!-- ================= COMMUN ================= -->
  <div class="form-group">
    <label>Description</label>
    <textarea [(ngModel)]="event.description"></textarea>
  </div>

  <div class="form-group">
    <label>Image</label>
    <input type="file" (change)="onFileSelected($event)">
  </div>

  <button class="btn-modern" (click)="createEvent()">
    Créer l’événement
  </button>

</div>
