<form [formGroup]="eventForm" (ngSubmit)="createEvent()" *ngIf="typeEvenementId">

  <div class="form-container">

    <h1 class="page-title">
      <span *ngIf="typeEvenementId === 2">Créer un VOYAGE</span>
      <span *ngIf="typeEvenementId === 1">OMRA & HAJ</span>
      <span *ngIf="typeEvenementId === 3">Créer une CONVENTION</span>
    </h1>

    <div class="form-group">
      <label>Titre</label>
      <input formControlName="titre">
      <div class="error" *ngIf="f['titre'].touched && f['titre'].invalid">Obligatoire</div>
    </div>

    <div class="form-group" *ngIf="typeEvenementId !== 3">
      <label>Lieu</label>
      <input formControlName="lieu">
    </div>

    <div class="form-group" *ngIf="typeEvenementId === 2">
      <label>Destination</label>
      <input formControlName="destination">
      <div class="error" *ngIf="f['destination'].invalid && f['destination'].touched">Obligatoire</div>
    </div>

    <!-- TYPE VOYAGE -->
    <div class="form-group" *ngIf="typeEvenementId === 2">
      <label>Type de déplacement</label>
      <select formControlName="isInternational">
        <option [ngValue]="false">Interne (Tunisie)</option>
        <option [ngValue]="true">Externe (International)</option>
      </select>
    </div>

    <div class="form-group" *ngIf="typeEvenementId === 1">
      <label>Agence</label>
      <input formControlName="agence">
      <div class="error" *ngIf="f['agence'].invalid && f['agence'].touched">Obligatoire</div>
    </div>

    <div class="form-group" *ngIf="typeEvenementId === 3">
      <label>Société</label>
      <input formControlName="societe">
      <div class="error" *ngIf="f['societe'].invalid && f['societe'].touched">Obligatoire</div>
    </div>

    <div class="form-group">
  <label>Date début</label>

  <input
    type="date"
    formControlName="dateDebut"
    [min]="today"
    [class.invalid]="eventForm.get('dateDebut')?.invalid && eventForm.get('dateDebut')?.touched"
  />

  <div class="error"
     *ngIf="eventForm.get('dateDebut')?.touched && eventForm.get('dateDebut')?.invalid">

  <span *ngIf="eventForm.get('dateDebut')?.errors?.['required']">
    Obligatoire
  </span>

  <span *ngIf="eventForm.get('dateDebut')?.errors?.['pastDate']">
    La date ne peut pas être dans le passé
  </span>

</div>

      <div class="form-group">
        <label>Date fin</label>
        <input type="date" formControlName="dateFin">
      </div>

      <div class="form-group" *ngIf="typeEvenementId !== 3">
  <label>Places</label>
  <input type="number" formControlName="nbPlaces">
</div>

      <div class="form-group">
        <label>Prix</label>
        <input type="number" formControlName="prix">
      </div>

      <!-- ========================= -->
      <!-- 🔥 REMISES (CORRIGÉES) -->
      <!-- ========================= -->

      <div class="remise-box" *ngIf="typeEvenementId !== 3">

  <h3>Remises (optionnel)</h3>

  <!-- ENFANT -12 -->
  <div class="remise-row">
    <label class="remise-item">
      <input type="checkbox" formControlName="remiseEnfant12Active">
      <span>Enfant (-12 ans)</span>
    </label>

    <input type="number"
      placeholder="%"
      formControlName="remiseEnfant12Pourcentage"
      *ngIf="eventForm.get('remiseEnfant12Active')?.value"
      class="input-remise">
  </div>

  <!-- ENFANT -18 -->
  <div class="remise-row">
    <label class="remise-item">
      <input type="checkbox" formControlName="remiseEnfant18Active">
      <span>Enfant (-18 ans)</span>
    </label>

    <input type="number"
      placeholder="%"
      formControlName="remiseEnfant18Pourcentage"
      *ngIf="eventForm.get('remiseEnfant18Active')?.value"
      class="input-remise">
  </div>

  <!-- COUPLE -->
  <div class="remise-row">
    <label class="remise-item">
      <input type="checkbox" formControlName="remiseCoupleActive">
      <span>Couple</span>
    </label>

    <input type="number"
      placeholder="%"
      formControlName="remiseCouplePourcentage"
      *ngIf="eventForm.get('remiseCoupleActive')?.value"
      class="input-remise">
  </div>

</div>
      <!-- ========================= -->

    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea formControlName="description"></textarea>
      <div class="error" *ngIf="f['description'].invalid && f['description'].touched">Obligatoire</div>
    </div>

    <div class="form-group">
      <input type="file" (change)="onFileSelected($event)" accept="image/*">
    </div>

    <button class="btn-modern" type="submit" [disabled]="eventForm.invalid">
      Créer l’événement
    </button>

  </div>

</form>
