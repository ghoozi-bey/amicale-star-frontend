<h2>📊 Mes sondages</h2>

<button routerLink="/gestion-sondages/create" class="create-btn">
  ➕ Créer un sondage
</button>

<hr>

<!-- LOADING -->
<div *ngIf="loading">Chargement...</div>

<!-- EMPTY -->
<div *ngIf="!loading && sondages.length === 0">
  Aucun sondage trouvé
</div>

<!-- LIST -->
<div class="sondage-grid">
  <div 
    *ngFor="let s of sondages" 
    class="sondage-card"
    (click)="goToDetails(s)"
  >

    <!-- TOP BAR -->
    <div class="card-top">
      <span class="status" [ngClass]="'status-' + s.statut">
        {{ formatStatus(s.statut) }}
      </span>
    </div>

    <!-- TITLE -->
    <h3>{{ s.title }}</h3>

    <!-- DESCRIPTION -->
    <p class="desc">
      {{ s.description }}
    </p>

    <!-- FOOTER (NEW) -->
    <div class="card-footer">
      <span>📝 {{ s.questions?.length || 0 }} questions</span>
    </div>

  </div>
</div>
