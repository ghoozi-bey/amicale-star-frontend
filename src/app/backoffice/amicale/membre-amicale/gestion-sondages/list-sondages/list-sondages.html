<h2>
  <span class="material-icons icon">poll</span>
  Mes sondages
</h2>

<button routerLink="/gestion-sondages/create" class="create-btn">
  <span class="material-icons icon">add_circle</span>
  Créer un sondage
</button>

<hr>

<!-- LOADING -->
<div *ngIf="loading">
  <span class="material-icons icon">hourglass_top</span>
  Chargement...
</div>

<!-- EMPTY -->
<div *ngIf="!loading && sondages.length === 0">
  <span class="material-icons icon">inbox</span>
  Aucun sondage trouvé
</div>

<!-- LIST -->
<div class="sondage-grid">

  <div 
    *ngFor="let s of sondages" 
    class="sondage-card"
    (click)="goToDetails(s)"
  >

    <!-- TOP BAR -->
    <div class="card-top">

      <span class="status" [ngClass]="'status-' + s.statut">
        {{ formatStatus(s.statut) }}
      </span>

    </div>

    <!-- TITLE -->
    <h3>{{ s.title }}</h3>

    <!-- DESCRIPTION -->
    <p class="desc">
      {{ s.description }}
    </p>

    <!-- FOOTER -->
    <div class="card-footer">

      <span class="footer-info">
        <span class="material-icons icon">quiz</span>
        {{ s.questions?.length || 0 }} questions
      </span>

    </div>

  </div>

</div>
