<div class="inscriptions-container">

  <!-- 🔥 TITLE -->
  <div class="page-header">
  <div class="title-left">
    <i class="fas fa-users"></i>
    <div>
      <h2>Gestion des inscriptions</h2>
      <p>Liste des participants de cet événement</p>
    </div>
  </div>
</div>

  <!-- 🔥 TABLE -->
  <div class="table-container">

    <table class="inscriptions-table">

      <thead>
        <tr>
          <th><i class="fas fa-user"></i> Nom</th>
          <th><i class="fas fa-envelope"></i> Email</th>
          <th><i class="fas fa-credit-card"></i> Paiement</th>
          <th><i class="fas fa-info-circle"></i> Statut</th>
          <th><i class="fas fa-cogs"></i> Actions</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let insc of inscriptions">

          <!-- NOM -->
          <td>
            <i class="fas fa-user-circle user-icon"></i>
            {{ insc.nom }}
          </td>

          <!-- EMAIL -->
          <td>{{ insc.email }}</td>

          <!-- PAIEMENT -->
          <td>
            <span 
              class="badge paiement"
              [ngClass]="insc.modePaiement === 'PAYE' ? 'paye' : 'non-paye'"
            >
              <i class="fas fa-wallet"></i>
              {{ insc.modePaiement }}
            </span>
          </td>

          <!-- STATUT -->
          <td>
            <span 
              class="badge statut"
              [ngClass]="{
                'attente': insc.statut === 'EN_ATTENTE',
                'acceptee': insc.statut === 'ACCEPTEE',
                'refusee': insc.statut === 'REFUSEE'
              }"
            >
              <i class="fas fa-circle"></i>
              {{ insc.statut }}
            </span>
          </td>

          <!-- ACTIONS -->
          <td class="actions">

            <!-- 👁 VOIR -->
            <button 
  class="btn btn-view"
  title="Voir détails"
  (click)="voirInscriptions(insc.eventId)"
>
  <i class="fas fa-eye"></i>
</button>

            <!-- ✅ ACCEPTER -->
            <button 
              class="btn-action btn-accept" 
              title="Accepter"
              *ngIf="insc.statut === 'EN_ATTENTE'"
            >
              <i class="fas fa-check"></i>
            </button>

            <!-- ❌ REFUSER -->
            <button 
              class="btn-action btn-refuse" 
              title="Refuser"
              *ngIf="insc.statut === 'EN_ATTENTE'"
            >
              <i class="fas fa-times"></i>
            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
