<div class="inscriptions-container">

  <!-- HEADER -->
  <div class="page-header">

  <!-- 🔥 BACK BUTTON -->
  <button class="btn-back" (click)="goBack()">
    <i class="fas fa-arrow-left"></i>
  </button>

  <div class="title-left">
    <i class="fas fa-users"></i>
    <div>
      <h2>Gestion des inscriptions</h2>
      <p>Liste des participants de cet événement</p>
    </div>
  </div>

</div>

  <!-- LOADING -->
  <div *ngIf="loading" class="loading">
    Chargement...
  </div>

  <!-- TABLE -->
  <div class="table-container" *ngIf="!loading && inscriptions && inscriptions.length > 0">

    <table class="inscriptions-table">

      <thead>
        <tr>
          <th><i class="fas fa-user"></i> Nom</th>
          <th><i class="fas fa-envelope"></i> Email</th>
          <th><i class="fas fa-credit-card"></i> Paiement</th>
          <th><i class="fas fa-info-circle"></i> Statut</th>
          <th><i class="fas fa-cogs"></i> Actions</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let insc of inscriptions; trackBy: trackById">

          <!-- NOM -->
          <td>
            <i class="fas fa-user-circle user-icon"></i>
            {{ insc.nom }}
          </td>

          <!-- EMAIL -->
          <td>{{ insc.email }}</td>

          <!-- PAIEMENT -->
          <td>
            <span class="badge paiement">
              <i class="fas fa-wallet"></i>
              {{ insc.modePaiement || '---' }}
            </span>
          </td>

          <!-- STATUT -->
          <td>
            <span 
              class="badge statut"
              [ngClass]="{
                'attente': insc.statut === 'EN_ATTENTE',
                'acceptee': insc.statut === 'ACCEPTEE',
                'refusee': insc.statut === 'REFUSEE'
              }"
            >
              <i class="fas fa-circle"></i>
              {{ insc.statut || '---' }}
            </span>
          </td>

          <!-- ACTIONS -->
          <td class="actions">

            <!-- 👁 VOIR -->
            <button 
              class="btn btn-view"
              title="Voir détails"
              (click)="voirDetails(insc.id)"
            >
              <i class="fas fa-eye"></i>
            </button>

            <!-- ✅ ACCEPTER -->
            <button 
              class="btn-action btn-accept"
              *ngIf="insc.statut === 'EN_ATTENTE'"
              (click)="accepter(insc.id)"
            >
              <i class="fas fa-check"></i>
            </button>

            <!-- ❌ REFUSER -->
            <button 
              class="btn-action btn-refuse"
              *ngIf="insc.statut === 'EN_ATTENTE'"
              (click)="refuser(insc.id)"
            >
              <i class="fas fa-times"></i>
            </button>

          </td>

        </tr>

      </tbody>

    </table>
    <div class="pagination" *ngIf="totalPages > 1">

  <button class="page-btn" (click)="prevPage()" [disabled]="currentPage === 0">
    <i class="fas fa-chevron-left"></i>
  </button>

  <span class="page-info">
    Page {{ currentPage + 1 }} / {{ totalPages }}
  </span>

  <button class="page-btn" (click)="nextPage()" [disabled]="currentPage === totalPages - 1">
    <i class="fas fa-chevron-right"></i>
  </button>

</div>

  </div>

  <!-- EMPTY -->
  <div *ngIf="!loading && (!inscriptions || inscriptions.length === 0)" class="empty">
    Aucune inscription trouvée
  </div>

</div>
