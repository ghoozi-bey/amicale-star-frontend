<div class="events-container" *ngIf="events$ | async as events; else noData">

  <div class="event-card" *ngFor="let event of events">

    <!-- 🔥 IMAGE + BADGE -->
    <div class="event-image-container">
      <img 
        *ngIf="event.photoUrl"
        [src]="event.photoUrl"
        class="event-image"
      />

      <span 
        class="status-badge"
        [ngClass]="{
          'active': event.statut !== 'ARCHIVE',
          'archived': event.statut === 'ARCHIVE'
        }"
      >
        {{ event.statut === 'ARCHIVE' ? 'ARCHIVÉ' : 'ACTIF' }}
      </span>
    </div>

    <!-- 🔥 CONTENT -->
    <div class="event-content">

      <!-- TITLE -->
      <div class="event-title">{{ event.titre }}</div>

      <!-- 🔥 LIEU (si existe) -->
      <div class="event-info" *ngIf="event.lieu">
        <i class="fas fa-map-marker-alt"></i>
        {{ event.lieu }}
      </div>

      <!-- 🔥 DATE (si existe) -->
      <div class="event-info" *ngIf="event.dateDebut">
        <i class="fas fa-calendar-alt"></i>
        {{ event.dateDebut }} → {{ event.dateFin }}
      </div>

      <!-- 🔥 PRIX (si existe) -->
      <div class="event-info event-price" *ngIf="event.prix">
        <i class="fas fa-coins"></i>
        {{ event.prix }} DT
      </div>

      <!-- 🔥 SOCIETE (cas convention) -->
      <div class="event-info" *ngIf="event.societe">
        <i class="fas fa-building"></i>
        {{ event.societe }}
      </div>

      <!-- 🔥 DESCRIPTION -->
      <div class="event-info description" *ngIf="event.description">
        <i class="fas fa-align-left"></i>
        {{ event.description }}
      </div>

      <!-- TYPE -->
      <div class="event-badge">
        <i class="fas fa-tag"></i>
        {{ event.typeEvenement?.nom }}
      </div>

      <!-- ACTIONS -->
      <div class="event-actions">
        <button class="btn btn-edit" (click)="editEvent(event.id)">
          <i class="fas fa-pen"></i> Modifier
        </button>

        <button 
          class="btn btn-delete"
          [disabled]="event.nbInscriptions > 0"
          [ngClass]="{'disabled-btn': event.nbInscriptions > 0}"
          title="Impossible de supprimer (inscriptions existantes)"
          (click)="deleteEvent(event.id)">
          <i class="fas fa-trash"></i> Supprimer
        </button>
      </div>

    </div>

  </div>

</div>

<ng-template #noData>
  <p class="no-data">Chargement des événements...</p>
</ng-template>
