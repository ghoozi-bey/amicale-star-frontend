<div class="container">

  <!-- HEADER -->
  <div class="page-header">
    <button class="btn-back" (click)="goBack()">
      <span class="material-icons">arrow_back</span>
    </button>

    <div class="header-text">
      <h1>Modifier événement</h1>
      <p>Gérer et mettre à jour les informations</p>
    </div>
  </div>

  <!-- CONTENU -->
  <div class="content-wrapper">

    <!-- FORM -->
    <form (ngSubmit)="updateEvent()" class="form-section">

      <div class="form-group">
        <label>Titre</label>
        <input [(ngModel)]="evenement.titre" name="titre">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea class="description-field"
                  [(ngModel)]="evenement.description"
                  name="description"></textarea>
      </div>

      <div class="form-group">
        <label>Lieu</label>
        <input [(ngModel)]="evenement.lieu" name="lieu">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Prix</label>
          <input type="number" [(ngModel)]="evenement.prix" name="prix">
        </div>

        <div class="form-group">
          <label>Date début</label>
          <input type="date" [(ngModel)]="evenement.dateDebut" name="dateDebut">
        </div>

        <div class="form-group">
          <label>Date fin</label>
          <input type="date" [(ngModel)]="evenement.dateFin" name="dateFin">
        </div>
      </div>

      <button class="submit-btn" type="submit">
        Enregistrer
      </button>

    </form>

    <!-- IMAGE -->
    <div class="image-card" *ngIf="imageUrl">
  <img [src]="imageUrl" alt="photo">

  <div class="image-overlay">
    <span>Image de l'événement</span>
  </div>
</div>

  </div>

</div>
