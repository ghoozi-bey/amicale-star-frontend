<div class="container">

  <div class="form-container" *ngIf="evenement">

    <h2>Modifier événement</h2>
    

    <!-- 🔥 IMAGE -->
    <div *ngIf="imageUrl" style="text-align:center;">
      <img [src]="imageUrl"
           alt="photo"
           style="width:200px; height:150px; object-fit:cover; border-radius:10px; margin-bottom:15px;">
    </div>

    <form (ngSubmit)="updateEvent()">

      <label>Titre</label>
      <input [(ngModel)]="evenement.titre" name="titre">

      <label>Description</label>
      <textarea [(ngModel)]="evenement.description" name="description"></textarea>

      <label>Lieu</label>
      <input [(ngModel)]="evenement.lieu" name="lieu">

      <label>Prix</label>
      <input type="number" [(ngModel)]="evenement.prix" name="prix">

      <label>Date début</label>
      <input type="date" [(ngModel)]="evenement.dateDebut" name="dateDebut">

      <label>Date fin</label>
      <input type="date" [(ngModel)]="evenement.dateFin" name="dateFin">

      <button class="submit-btn" type="submit">
        Enregistrer
      </button>

    </form>

  </div>

</div>
