<div class="sidebar">

  <!-- Profil -->
  <div class="user-profile" (click)="goToProfile()">

    <!-- PHOTO -->
    <ng-container *ngIf="!loadingPhoto">

      <img *ngIf="userPhoto" [src]="userPhoto" class="avatar">

      <img *ngIf="!userPhoto" src="assets/default-pfp.jpg" class="avatar">

    </ng-container>

    <!-- ✅ NAME FIX FINAL -->
    <ng-container *ngIf="user$ | async as user; else noUser">
      <span class="name">
        {{ user.prenom }} {{ user.nom }}
      </span>
    </ng-container>

    <ng-template #noUser>
      <span class="name">Utilisateur</span>
    </ng-template>

  </div>

  <!-- 🌍 PUBLIC -->
  <a routerLink="/dashboard" routerLinkActive="active" class="sidebar-item">
    <span class="material-icons">dashboard</span>
    Dashboard
  </a>

  <a routerLink="/evenements" routerLinkActive="active" class="sidebar-item">
    <span class="material-icons">event</span>
    Mes Inscriptions
  </a>

  <a routerLink="/sondages" routerLinkActive="active" class="sidebar-item">
    <span class="material-icons">poll</span>
    Sondages
  </a>

  <a routerLink="/elections" routerLinkActive="active" class="sidebar-item">
    <span class="material-icons">how_to_vote</span>
    Élections
  </a>

  <!-- 🟢 MEMBRE AMICALE -->
  <div *ngIf="hasRole('MEMBRE_AMICALE')">

    <button (click)="toggleEvents()" class="menu-button sidebar-item">
      <span class="material-icons">settings</span>
      Gestion événements
    </button>

    <ul [hidden]="!showEventsMenu" class="submenu">
      <li><a routerLink="/gestion-evenements" class="sidebar-item">Ajouter événement</a></li>
      <li><a routerLink="/mes-evenements-amicale" class="sidebar-item">Mes événements</a></li>
    </ul>

    <button (click)="toggleSondages()" class="menu-button sidebar-item">
  <span class="material-icons">bar_chart</span>
  Gestion sondages
</button>

    <ul [hidden]="!showSondagesMenu" class="submenu">
      <li><a routerLink="/gestion-sondages/create">Créer sondage</a></li>
      <li><a routerLink="/gestion-sondages">Liste sondages</a></li>
    </ul>

  </div>

  <!-- 🟣 RESPONSABLE -->
  <div *ngIf="hasRole('RESPONSABLE_ELECTION')">
    <button (click)="toggleElections()">Gestion élections</button>
    <ul [hidden]="!showElectionsMenu">
      <li><a routerLink="/elections/create">Créer</a></li>
      <li><a routerLink="/elections">Liste</a></li>
    </ul>
  </div>

  <!-- 🔴 ADMIN -->
  <div *ngIf="hasRole('ADMIN')">

    <button (click)="toggleUsers()" class="menu-button sidebar-item">
      <span class="material-icons">people</span>
      Gestion utilisateurs
    </button>

    <ul [hidden]="!showUsersMenu" class="submenu">
      <li>
        <a routerLink="/admin-create-user" routerLinkActive="active" class="sidebar-item">
          ➕ Créer
        </a>
      </li>
      <li>
        <a routerLink="/admin-users" routerLinkActive="active" class="sidebar-item">
          📋 Liste
        </a>
      </li>
    </ul>

  </div>

</div>
