<h2>Dashboard</h2>

<div class="cards">

  <div class="card">
    <h3>Evenements</h3>
    <p>{{ (evenements$ | async)?.length || 0 }}</p>
  </div>

  <div class="card">
    <h3>Sondages</h3>
    <p>0</p>
  </div>

  <div class="card">
    <h3>Elections</h3>
    <p>0</p>
  </div>

</div>

<h2>Evenements récents</h2>

<div class="events" *ngIf="evenements$ | async as evenements">

  <div class="event-card"
       *ngFor="let e of evenements"
       (click)="openDetails(e)">

    <!-- 🔥 IMAGE AVEC LOADER -->
    <img 
      [src]="'http://localhost:8080/api/evenements/photo/' + e.id"
      (load)="onImageLoad()"
      (error)="onImageError()"
      loading="lazy"
    >

    <h3>{{ e.titre }}</h3>

    <p>{{ e.dateDebut }}</p>

  </div>

</div>
