<h2 class="title">Dashboard</h2>

<div class="cards">

  <div class="card stat">
    <span class="material-icons icon">event</span>
    <p>Evenements</p>
    <p><p>{{ evenementsActifs.length }}</p>
  </div>

  <div class="card stat">
    <span class="material-icons icon">poll</span>
    <h3>Sondages</h3>
    <p>{{ activeSondages.length }}</p>
  </div>

  <div class="card stat">
    <span class="material-icons icon">how_to_vote</span>
    <h3>Elections</h3>
    <p>{{ activeElections.length }}</p>
  </div>

</div>

<h2 class="subtitle">Evenements récents</h2>

<div class="events">

  <div class="event-card"
       *ngFor="let event of evenementsActifs; trackBy: trackById"
       (click)="goToDetails(event)">

    <div class="image-container">
      <img 
        [src]="event.photoUrl"
        (load)="onImageLoad()"
        (error)="onImageError()"
        loading="lazy">
    </div>

    <div class="content">
      <h3>{{ event.titre }}</h3>
      <p>{{ event.dateDebut }}</p>
    </div>

  </div>

</div>
