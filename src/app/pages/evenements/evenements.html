<!-- 🔄 LOADING -->
<div *ngIf="loading" class="loading-container">
  <div class="spinner"></div>
  <p>Chargement des événements...</p>
</div>

<!-- 📦 DATA -->
<div *ngIf="!loading">

  <div class="events-container" *ngIf="events.length > 0; else emptyState">

    <!-- 🔥 CLICK CARD -->
    <div class="event-card" 
         *ngFor="let event of events"
         (click)="goToInscription(event.id)">

      <img 
        class="event-image"
        [src]="event.imageUrl"
        (error)="onImageError($event)">

      <div class="event-title">{{ event.titre }}</div>

      <div class="event-info">📍 {{ event.lieu }}</div>
      <div class="event-info">
        📅 {{ event.dateDebut || '-' }} → {{ event.dateFin || '-' }}
      </div>

    </div>

  </div>

</div>

<!-- ❌ EMPTY STATE -->
<ng-template #emptyState>
  <div class="empty-container">
    <div class="empty-icon">📭</div>
    <h2>Aucun événement</h2>
    <p>Vous n'êtes inscrit à aucun événement pour le moment.</p>
  </div>
</ng-template>
