<div class="inscription-page">

  <div class="inscription-card">

    <h2>Inscription à l'événement</h2>

    <!-- IMAGE -->
    <img 
      class="event-img"
      [src]="'http://localhost:8080/api/evenements/photo/' + eventId"
    >

    <!-- INFOS -->
    <div class="info">
      <p><strong>ID événement :</strong> {{ eventId }}</p>
    </div>

    <!-- FORM -->
    <div class="form">

      <button 
  type="button" 
  class="btn"
  (click)="inscrire()">
  Confirmer inscription
</button>

    </div>

  </div>

</div>
