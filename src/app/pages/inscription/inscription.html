<div class="inscription-page">

  <div class="inscription-card">

    <h2>Inscription à l'événement</h2>

    <!-- IMAGE EVENT -->
    <img 
      class="event-img"
      [src]="'http://localhost:8080/api/evenements/photo/' + eventId"
    >

    <!-- INFOS -->
    <div class="info">
      <p><strong>ID événement :</strong> {{ eventId }}</p>
    </div>

    <!-- FORM -->
    <form>

      <label>Nom complet</label>
      <input type="text" placeholder="Votre nom">

      <label>Email</label>
      <input type="email" placeholder="Votre email">

      <label>Téléphone</label>
      <input type="text" placeholder="Votre numéro">

      <button type="button" class="btn">Confirmer inscription</button>

    </form>

  </div>

</div>
