<div class="inscription-page">

  <!-- IMAGE -->
  <div class="event-banner">
    <img [src]="'http://localhost:8080/api/evenements/photo/' + eventId">
  </div>

  <div class="card">

    <!-- INFOS -->
    <h2>Informations personnelles</h2>

    <div class="form-grid">

      <div class="form-group">
        <label>Nom</label>
        <input [(ngModel)]="user.nom" disabled>
      </div>

      <div class="form-group">
        <label>Prénom</label>
        <input [(ngModel)]="user.prenom" disabled>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input [(ngModel)]="user.email" disabled>
      </div>

      <div class="form-group">
        <label>Téléphone</label>
        <input [(ngModel)]="user.telephone" disabled>
      </div>

      <div class="form-group">
        <label>Matricule</label>
        <input [(ngModel)]="user.matricule" disabled>
      </div>

      <div class="form-group">
        <label>CIN</label>
        <input [(ngModel)]="user.cin" disabled>
      </div>

    </div>

    <!-- INSCRIPTION -->
    <h2>Détails inscription</h2>

    <!-- 🔥 PASSEPORT ADHERENT -->
    <div class="form-group full" *ngIf="isPassportRequired">
      <label>Passeport Adhérent (PDF obligatoire)</label>
      <input type="file" accept="application/pdf"
             (change)="onAdherentFileChange($event)">
    </div>
    <div class="form-group">
  <label>Mode paiement des échéances</label>
  <select [(ngModel)]="modePaiementEcheance">
    <option value="VIREMENT">Virement</option>
    <option value="CASH">Cash</option>
    <option value="SALAIRE">Salaire</option>
  </select>
</div>

    <div *ngIf="isPaiementComplexe()">

  <h3>Paiement avance</h3>

  <!-- AVANCE -->
  <div class="form-group">
    <label>Avance (TND)</label>
    <input type="number" [(ngModel)]="avance" />
  </div>

  <!-- MODE AVANCE -->
  <div class="form-group">
    <label>Mode paiement avance</label>
    <select [(ngModel)]="modePaiementAvance">
      <option value="CASH">Cash</option>
      <option value="VIREMENT">Virement</option>
    </select>
  </div>

  <!-- NOMBRE MOIS -->
  <div class="form-group">
    <label>Nombre de mois</label>
    <input type="number" [(ngModel)]="nombreMois" />
  </div>

  <!-- DATE -->
  <div class="form-group">
    <label>Date début paiement</label>
    <input type="date" [(ngModel)]="dateDebutPaiement" />
  </div>

</div>

    <!-- FAMILLE -->
    <h2>Famille</h2>

    <div class="family-section">

      <!-- CHECKBOX -->
      <div class="checkbox-group">

        <label class="checkbox-item">
          <input type="checkbox" [(ngModel)]="hasWife">
          <span>Ajouter épouse</span>
        </label>

        <label class="checkbox-item">
          <input type="checkbox" [(ngModel)]="hasChildren">
          <span>Ajouter enfants</span>
        </label>

      </div>

      <!-- ÉPOUSE -->
      <div *ngIf="hasWife" class="family-card">

        <h3>conjoint</h3>

        <div class="form-grid">

          <div class="form-group">
            <label>Nom</label>
            <input [(ngModel)]="wife.nom">
          </div>

          <div class="form-group">
            <label>Prénom</label>
            <input [(ngModel)]="wife.prenom">
          </div>

          <div class="form-group">
            <label>Date de naissance</label>
            <input type="date" [(ngModel)]="wife.dateNaissance">
          </div>

          <div class="form-group">
            <label>CIN</label>
            <input [(ngModel)]="wife.cin">
          </div>

          <div class="form-group">
            <label>Téléphone</label>
            <input [(ngModel)]="wife.telephone">
          </div>

          <!-- 🔥 PASSEPORT ÉPOUSE -->
          <div class="form-group full" *ngIf="isPassportRequired">
            <label>Passeport (PDF obligatoire)</label>
            <input type="file" accept="application/pdf"
                   (change)="onFileChange($event,'wife')">
          </div>

        </div>

      </div>

      <!-- ENFANTS -->
      <div *ngIf="hasChildren" class="family-card">

        <h3>Enfants</h3>

        <div class="form-group">
          <label>Nombre d'enfants</label>
          <select [(ngModel)]="nbEnfants" (change)="updateChildren()">
            <option *ngFor="let n of [1,2,3,4,5,6]" [value]="n">{{n}}</option>
          </select>
        </div>

        <div *ngFor="let child of children; let i = index" class="child-card">

          <h4>Enfant {{i+1}}</h4>

          <div class="form-grid">

            <div class="form-group">
              <label>Nom</label>
              <input [(ngModel)]="child.nom">
            </div>

            <div class="form-group">
              <label>Prénom</label>
              <input [(ngModel)]="child.prenom">
            </div>

            <div class="form-group">
              <label>Date de naissance</label>
              <input type="date" [(ngModel)]="child.dateNaissance">
            </div>

            <!-- 🔥 PASSEPORT ENFANT -->
            <div class="form-group full" *ngIf="isPassportRequired">
              <label>Passeport (PDF obligatoire)</label>
              <input type="file" accept="application/pdf"
                     (change)="onFileChange($event,'child',i)">
            </div>

          </div>

        </div>

      </div>

    </div>
    <div class="payment-plan">

    <!-- BUTTON -->
    <button 
      (click)="inscrire()"
      [disabled]="!modePaiementEcheance || nbPlaces === 0 || isLoading"
    >
      {{ isLoading ? 'Envoi en cours...' : 'Confirmer inscription' }}
    </button>

    <!-- PLACES -->
    

    

  </div>

  <!-- MODAL -->
  <div *ngIf="showModal" class="modal-overlay">
    <div class="modal-box">

      <h2 [style.color]="isSuccess ? 'green' : 'red'">
        {{ isSuccess ? 'Succès' : 'Erreur' }}
      </h2>

      <p>{{ modalMessage }}</p>

      <button (click)="showModal = false">OK</button>

    </div>
  </div>

</div>
