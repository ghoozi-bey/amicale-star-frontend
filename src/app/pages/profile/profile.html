<div *ngIf="!loading" class="profile-container">

  <h2>Modifier mon profil</h2>

  <form *ngIf="form" [formGroup]="form" (ngSubmit)="update()">

    <!-- EMAIL -->
    <label>Email</label>
    <input 
      type="email" 
      formControlName="email"
      placeholder="Entrez votre email"
    >

    <!-- TELEPHONE -->
    <label>Téléphone</label>
    <input 
      type="text" 
      formControlName="telephone"
      placeholder="Entrez votre numéro"
    >

    <!-- PASSWORD ACTUEL -->
    <label>Mot de passe actuel</label>
    <div class="password-field">
      <input 
        [type]="showCurrent ? 'text' : 'password'" 
        formControlName="currentPassword"
        placeholder="Entrez votre mot de passe actuel"
      >
      <span (click)="toggleCurrent()" class="eye">👁</span>
    </div>

    <!-- NEW PASSWORD -->
    <label>Nouveau mot de passe</label>
    <div class="password-field">
      <input 
        [type]="showNew ? 'text' : 'password'" 
        formControlName="newPassword"
        placeholder="Entrez un nouveau mot de passe"
      >
      <span (click)="toggleNew()" class="eye">👁</span>
    </div>

    <!-- PHOTO -->
    <label>Photo de profil</label>
    <input type="file" (change)="onFileSelected($event)">

    <!-- PREVIEW -->
    <img *ngIf="preview" [src]="preview" class="preview">

    <button type="submit">Modifier</button>

  </form>

</div>
