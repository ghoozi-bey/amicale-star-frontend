<div *ngIf="!loading" class="profile-container">

  <h2>Modifier mon profil</h2>

  <!-- 🔥 AVATAR -->
<div class="avatar-container">

  <div 
    class="avatar"
    [ngStyle]="{
      'background-image': (preview || userPhoto) 
        ? 'url(' + (preview || userPhoto) + ')' 
        : 'none'
    }"
  >

    <!-- 🗑 DELETE (only if real photo) -->
    <span 
      class="delete-icon"
      *ngIf="hasRealPhoto()"
      (click)="removePhoto($event)">
      🗑
    </span>

    <!-- ✏️ EDIT -->
    <span class="camera">
      {{ (preview || userPhoto) ? '✏️' : '📷' }}
    </span>

    <input 
      type="file"
      (change)="onFileSelected($event)"
      class="file-input"
    >
  </div>

  <p *ngIf="photoError" class="error-text">
    {{ photoMessage }}
  </p>

</div>

  <form *ngIf="form" [formGroup]="form" (ngSubmit)="update()">

    <label>Nom</label>
    <input type="text" formControlName="nom">

    <label>Prénom</label>
    <input type="text" formControlName="prenom">

    <label>Email</label>
    <input type="email" formControlName="email">

    <label>Téléphone</label>
    <input type="text" formControlName="telephone">

    <!-- PASSWORD ACTUEL -->
    <label>Mot de passe actuel</label>
    <div class="password-field">
      <input 
        [type]="showCurrent ? 'text' : 'password'" 
        formControlName="currentPassword"
        [class.error]="passwordError"
      >
      <span (click)="toggleCurrent()" class="eye">👁</span>
    </div>

    <!-- NEW PASSWORD -->
    <label>Nouveau mot de passe</label>
    <div class="password-field">
      <input 
        [type]="showNew ? 'text' : 'password'" 
        formControlName="newPassword"
        [class.error]="passwordError"
      >
      <span (click)="toggleNew()" class="eye">👁</span>
    </div>

    <p *ngIf="passwordError" class="error-text">
      {{ passwordMessage }}
    </p>

    <button type="submit">Modifier</button>

  </form>
</div>
